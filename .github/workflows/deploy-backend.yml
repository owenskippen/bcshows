name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'infrastructure/terraform/**'
      - '.github/workflows/deploy-backend.yml'
      - 'package.json'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'infrastructure/terraform/**'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Test Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint --workspace=backend
        continue-on-error: true

      - name: Type check
        run: npm run type-check --workspace=backend
        continue-on-error: true

      - name: Run tests
        run: npm run test --workspace=backend
        continue-on-error: true

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to AWS Lambda
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: backend/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Deploy with Terraform
        working-directory: infrastructure/terraform
        run: |
          terraform init
          terraform plan -var-file=terraform.tfvars -out=tfplan
          terraform apply -auto-approve tfplan
        env:
          AWS_REGION: us-west-2

      - name: Verify deployment
        run: |
          LAMBDA_NAME=$(terraform -chdir=infrastructure/terraform output -raw lambda_shows_handler_name)
          aws lambda invoke --function-name $LAMBDA_NAME /tmp/response.json
          cat /tmp/response.json

      - name: Comment PR with deployment info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Backend build successful!\n\nReady for staging deployment once merged.'
            })
